<!-- app/views/auth/register.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Controle de Notas</title>
</head>
<body>
    <h2>Criar Nova Conta</h2>

    <!-- Exibição de mensagens de erro ou sucesso (Flash messages do Flask) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <!-- O formulário envia os dados via POST para a rota de cadastro -->
    <form method="POST">
        <div>
            <label for="username">Nome de Usuário:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <br>
        <div>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <br>
        <div>
            <label for="confirm_password">Confirmar Senha:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <br>
        <button type="submit">Cadastrar</button>
    </form>

    <p>Já possui uma conta? <a href="{{ url_for('auth.login') }}">Faça login aqui</a>.</p>
</body>
</html>
