<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Lista de Trabalhos</title>
</head>
<body>
    <h2>Trabalhos Registados</h2>
    
    <!-- Link dinâmico para a página de cadastro -->
    <a href="{{ url_for('trabalho.cadastrar') }}">Cadastrar Novo Trabalho</a>
    <br><br>

    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>Título</th>
                <th>Matéria</th>
                <th>Data Limite</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>
            <!-- O Jinja2 percorre a lista de trabalhos -->
            {% for trabalho in trabalhos %}
            <tr>
                <td>{{ trabalho.titulo }}</td>
                <td>{{ trabalho.materia }}</td>
                <td>{{ trabalho.data_limite }}</td>
                <td>{{ trabalho.descricao }}</td>
            </tr>
            <!-- Se a lista estiver vazia, mostra esta mensagem -->
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">Nenhum trabalho registado ainda.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <!-- Link para voltar ao painel principal ou fazer logout -->
    <a href="{{ url_for('main.welcome') }}">Voltar ao Dashboard</a>
</body>
</html>
