<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Trabalho - Controle de Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <div class="header-bar">
            <h1>Novo Trabalho</h1>
            <a href="{{ url_for('trabalho.listar') }}" class="btn btn-secondary">Ver Todos</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card">
            <form method="POST" action="{{ url_for('trabalho.cadastrar') }}">
                <div class="form-group">
                    <label for="titulo">Título do Trabalho *</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Trabalho Final de Python" required>
                </div>

                <div class="form-group">
                    <label for="materia">Matéria *</label>
                    <input type="text" id="materia" name="materia" placeholder="Ex: Linguagem de Programação" required>
                </div>

                <div class="form-group">
                    <label for="data_limite">Data Limite *</label>
                    <input type="date" id="data_limite" name="data_limite" required>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" placeholder="Detalhes ou requisitos do trabalho..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" style="flex: 1;">Salvar Trabalho</button>
                    <a href="{{ url_for('main.welcome') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
