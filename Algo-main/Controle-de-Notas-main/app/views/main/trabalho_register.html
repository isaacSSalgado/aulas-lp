<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Trabalho - Controle de Trabalhos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <h2>Cadastrar Novo Trabalho</h2>

        <!-- Exibição de Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="alertas">
                {% for category, message in messages %}
                    <li class="alert-{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div>
                <label for="titulo">Título do Trabalho *</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ex: Pesquisa de História" required>
            </div>

            <div>
                <label for="materia">Matéria / Disciplina *</label>
                <input type="text" id="materia" name="materia" placeholder="Ex: História, Matemática..." required>
            </div>

            <div>
                <label for="data_limite">Data Limite de Entrega *</label>
                <input type="date" id="data_limite" name="data_limite" required>
            </div>

            <div>
                <label for="descricao">Descrição ou Instruções</label>
                <textarea id="descricao" name="descricao" rows="4" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;" placeholder="Detalhes do que deve ser entregue..."></textarea>
            </div>

            <button type="submit">Cadastrar Trabalho</button>
        </form>

        <br>
        <a href="{{ url_for('main.welcome') }}">← Voltar ao Dashboard</a>
    </div>

</body>
</html>
